# Publish the game to GitHub Pages. The Lean backend runs in the browser as
# WebAssembly (web/public/engine, built by wasm/build.sh and committed), so the
# site is static files only.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install tools (map generator)
        run: npm ci --prefix tools
      - name: Install web
        run: npm ci --prefix web --ignore-scripts
      - name: Build web
        run: cd web && npx vite build --base=/sevenbridges/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
